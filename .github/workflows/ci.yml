name: CI

permissions:
  contents: read

on:
  push:
    branches:
    - master
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Make uv use the interpreter that actions/setup-python installed instead
  # of downloading one of its own.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
    - name: Explain the failure
      if: failure()
      run: |
        message="pre-commit failed. Run 'pre-commit run --all-files' locally, commit the changes it makes and fix what it cannot fix by itself."
        echo "::error::$message"
        echo "$message" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: tests (${{ matrix.python-version }}, ${{ matrix.env.TOXENV }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.10"
          env:
            TOXENV: py
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.12"
          env:
            TOXENV: py
        - python-version: "3.13"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: py
        - python-version: "3.15.0-rc.1"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: twinecheck

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Run tox
      env: ${{ matrix.env }}
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      if: matrix.env.TOXENV == 'py'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
