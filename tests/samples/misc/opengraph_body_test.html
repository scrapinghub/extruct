<!DOCTYPE html>
<html>
<head>
<title>OpenGraph tags in body</title>
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
</head>

<body>

<div id="content">
<p>Some markup that appears before the OpenGraph tags, similar to
sites that inject them dynamically into the body instead of the head.</p>

<meta property="og:title" content="OpenGraph in the Body"/>
<meta property="og:type" content="article"/>
<meta property="og:url" content="https://example.com/opengraph-in-body.html"/>
<meta property="og:image" content="https://example.com/images/test.jpg"/>
<meta property="og:site_name" content="Example Site"/>
<meta property="article:published_time" content="2020-04-08T08:40:28-00:00" />
</div>

</body>
</html>
