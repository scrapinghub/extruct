<!DOCTYPE html>
<html prefix="og: http://ogp.me/ns# custom: https://example.com/ns/custom#">
<head>
<title>OpenGraph tags in head and body</title>
<meta property="og:title" content="Head Title"/>
<meta property="og:type" content="article"/>
</head>

<body>

<div id="content">
<meta property="og:url" content="https://example.com/head-and-body.html"/>

</div>

</body>
</html>
